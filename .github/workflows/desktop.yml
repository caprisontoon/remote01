name: remocon

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:admin
      # 관리자 웹 (정적 파일). 웹 서버 아무 경로에 올리면 열린다
      - uses: actions/upload-artifact@v5
        with:
          name: TOONA-admin-web
          path: dist-admin/
          if-no-files-found: error

  # Windows 설치 파일(NSIS)은 Wine이 필요해 리눅스에서 만들 수 없으므로 Windows 러너에서 만든다.
  windows-installer:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: TOONA-Setup-windows
          path: release/*.exe
          if-no-files-found: error
