name: release

# 설치 파일 배포. package.json의 version(예: 2.0.0)마다 GitHub 릴리스 v<version>을 하나 만들고 Windows 설치 파일을 올린다.
# - 브랜치에 푸시했을 때 그 버전의 릴리스가 아직 없으면 만든다 (이미 있으면 건너뜀 → 새로 내려면 version을 올린다).
# - v로 시작하는 태그를 올리면 그 태그의 릴리스를 만들거나 파일을 바꿔 올린다.
# 로그인 없이 받을 수 있는 고정 링크:
#   최신 버전  https://github.com/caprisontoon/remote01/releases/latest/download/TOONA-Setup.exe
#   버전별     https://github.com/caprisontoon/remote01/releases/download/v<버전>/TOONA-Setup-<버전>.exe
on:
  push:
    branches: [main, 'claude/trusting-wozniak-ghvzg2']
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag 릴리스가 이미 있어 건너뜁니다. 새로 내려면 package.json의 version을 올리세요."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: 릴리스에 올리기
        shell: bash
        run: |
          set -e
          exe=$(ls release/TOONA-Setup-*.exe)
          # 자동 업데이트용: latest.yml(새 버전 정보)과 blockmap(차등 다운로드)을 함께 올린다
          test -f release/latest.yml || { echo "latest.yml이 없습니다 (package.json build.publish 확인)"; exit 1; }
          files=("$exe" release/latest.yml)
          ls "$exe".blockmap >/dev/null 2>&1 && files+=("$exe".blockmap)
          # 버전 없는 이름도 함께 올려 "최신 버전" 링크가 늘 같은 주소가 되게 한다
          cp "$exe" release/TOONA-Setup.exe
          files+=(release/TOONA-Setup.exe)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # 태그가 없으면 지금 빌드한 커밋에 만든다
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "TOONA 리모컨 $TAG" --notes-file .github/release-notes.md --latest
          fi
